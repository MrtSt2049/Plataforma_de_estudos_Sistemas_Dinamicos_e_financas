:1440px;margin:0 auto\" data-canvas-width=\"1440\" data-canvas-height=\"2450\" data-document-role=\"page\" data-label=\"00 · Brand &amp; Design System\">\n\n<header style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:1px solid #263442;padding-bottom:20px\">\n<div>\n<div class=\"mono\" style=\"font-size:11px;color:#8997A5;letter-spacing:.1em\">QUANTLAB · BRAND &amp; DESIGN SYSTEM v0.1<\u002Fdiv>\n<h1 style=\"margin:6px 0 0;font-size:28px;font-weight:600;letter-spacing:-.02em\">Institutional Quantitative Research Environment<\u002Fh1>\n<div style=\"color:#8997A5;margin-top:6px\">Explore. Model. Simulate. Understand.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px\"><span class=\"bd wn\">DEMO SPEC<\u002Fspan><span class=\"bd q\">Dark-first<\u002Fspan><\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"pn\" style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:stretch\">\n<div style=\"flex:2 1 480px;background:#FBFCFD;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:12px\"><img src=\"db464995-18df-474e-921d-41ad23b3f559\" alt=\"QuantLab primary logo: ring with bar chart and trajectory, wordmark QUANTLAB\" style=\"width:100%;max-width:640px;height:auto;display:block\"><\u002Fdiv>\n<div style=\"flex:1 1 280px;display:flex;flex-direction:column;gap:12px;justify-content:center\">\n<h2>01 · Primary logo (supplied)<\u002Fh2>\n<div style=\"display:flex;gap:12px;align-items:center\"><span style=\"width:56px;height:56px;border-radius:10px;background:#F4F7FA;display:inline-flex;align-items:center;justify-content:center\"><img src=\"16dfe125-132c-493c-9761-cc7dceeca665\" alt=\"\" style=\"width:46px;height:46px;object-fit:contain\"><\u002Fspan><span style=\"width:30px;height:30px;border-radius:6px;background:#F4F7FA;display:inline-flex;align-items:center;justify-content:center\"><img src=\"16dfe125-132c-493c-9761-cc7dceeca665\" alt=\"\" style=\"width:25px;height:25px;object-fit:contain\"><\u002Fspan><span style=\"color:#8997A5;font-size:11.5px\">Symbol on a light tile for dark UI<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;color:#8997A5;line-height:1.6\">The supplied artwork has a light background and navy text, so in the dark interface the symbol sits on a light tile and the wordmark is set live in Inter. A transparent SVG of the symbol is recommended for production. Below ~24 px the fine spiral lines blur: use the simplified vector mark in the next section.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Logo + principles -->\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<section class=\"pn\" style=\"flex:2 1 560px\">\n<h2>01b · Simplified UI mark (16–48 px)<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;align-items:stretch\">\n<div style=\"flex:1 1 280px;background:#0B0F14;border:1px solid #1d2935;border-radius:6px;min-height:200px;display:flex;align-items:center;justify-content:center;gap:16px\">\n<svg sc-camel-view-box=\"0 0 28 28\" width=\"72\" height=\"72\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"QuantLab mark\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M9 14c2-5 4 2 7-3\" stroke=\"#8B5CF6\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M18.5 18.5l2.5 2.5 2-1.5 2.5 1\" stroke=\"#E8EDF2\"><\u002Fpath><\u002Fsvg>\n<div><div style=\"font-size:40px;letter-spacing:.05em;font-weight:700;line-height:1\">QUANT<span style=\"color:#3B82F6;font-weight:500\">LAB<\u002Fspan><\u002Fdiv><div style=\"font-size:11px;color:#8997A5;margin-top:6px;letter-spacing:.02em\">Quantitative Finance &amp; Computational Dynamics<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 200px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"background:#E8EDF2;border-radius:6px;flex:1;min-height:92px;display:flex;align-items:center;justify-content:center;gap:10px\"><svg sc-camel-view-box=\"0 0 28 28\" width=\"36\" height=\"36\" fill=\"none\" stroke=\"#0B0F14\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M9 14c2-5 4 2 7-3\"><\u002Fpath><path d=\"M18.5 18.5l2.5 2.5 2-1.5 2.5 1\"><\u002Fpath><\u002Fsvg><span style=\"color:#0B0F14;font-weight:700;letter-spacing:.05em;font-size:20px\">QUANT<span style=\"font-weight:500\">LAB<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;align-items:flex-end;background:#0B0F14;border:1px solid #1d2935;border-radius:6px;padding:14px;flex:1\">\n<svg sc-camel-view-box=\"0 0 28 28\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M9 14c2-5 4 2 7-3\" stroke=\"#8B5CF6\"><\u002Fpath><path d=\"M18.5 18.5l2.5 2.5 2-1.5 2.5 1\" stroke=\"#E8EDF2\"><\u002Fpath><\u002Fsvg>\n<svg sc-camel-view-box=\"0 0 28 28\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M9 14c2-5 4 2 7-3\" stroke=\"#8B5CF6\"><\u002Fpath><path d=\"M18.5 18.5l2.5 2.5 2-1.5 2.5 1\" stroke=\"#E8EDF2\"><\u002Fpath><\u002Fsvg>\n<svg sc-camel-view-box=\"0 0 28 28\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M18.5 18.5l2.5 2.5 2-1.5 2.5 1\" stroke=\"#E8EDF2\"><\u002Fpath><\u002Fsvg>\n<svg sc-camel-view-box=\"0 0 28 28\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#3B82F6\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M19 19l5 3\" stroke=\"#E8EDF2\"><\u002Fpath><\u002Fsvg>\n<span class=\"lab\">48 · 32 · 20 · 16 px<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"color:#8997A5;line-height:1.6;margin:14px 0 0;max-width:720px\">The Q is a phase-space ring whose open tail is a trajectory leaving the loop. Inside, a single sinusoidal path stands for a return series; it disappears below 24 px so the mark stays legible at favicon size. Wordmark: Inter 700 for QUANT, 500 for LAB, tracking +5 %. No coins, no upward arrows, no AI sparkles.<\u002Fp>\n<\u002Fsection>\n<section class=\"pn\" style=\"flex:1 1 320px\">\n<h2>02 · Principles<\u002Fh2>\n<ol style=\"margin:14px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:10px;color:#C4CFDA;line-height:1.5\">\n<li><b style=\"color:#E8EDF2\">Colour is data.<\u002Fb> Green/red only for signed change; blue for actions and analysis; purple for dynamical systems; amber for warnings and demo data.<\u002Fli>\n<li><b style=\"color:#E8EDF2\">Never colour alone.<\u002Fb> Every signed value also carries ▲/▼ and +/−.<\u002Fli>\n<li><b style=\"color:#E8EDF2\">Every chart asks a question<\u002Fb> and states it above the plot.<\u002Fli>\n<li><b style=\"color:#E8EDF2\">Demo is labelled.<\u002Fb> Any synthetic number carries a DEMO badge until real data is wired.<\u002Fli>\n<li><b style=\"color:#E8EDF2\">Dense, not crowded.<\u002Fb> 12.5 px base, 34 px rows, 1 px borders, 6 px radius.<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n<\u002Fdiv>\n\n<!-- Colour -->\n<section class=\"pn\">\n<h2>03 · Colour tokens<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px\">\n<sc-for list=\"{{swatches}}\" as=\"s\" hint-placeholder-count=\"12\">\n<div style=\"border:1px solid #263442;border-radius:6px;overflow:hidden;background:#0B0F14\"><div style=\"height:54px;background:{{s.hex}}\"><\u002Fdiv><div style=\"padding:8px 10px\"><div style=\"font-size:12px;font-weight:500\">{{s.n}}<\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:#8997A5\">{{s.hex}}<\u002Fdiv><div style=\"font-size:10.5px;color:#8997A5;margin-top:3px;line-height:1.4\">{{s.role}}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:11.5px;color:#8997A5;line-height:1.5\">\n<div style=\"flex:1 1 300px\"><b style=\"color:#E8EDF2\">Contrast (WCAG).<\u002Fb> Text #E8EDF2 on #0B0F14 ≈ 16:1. Secondary #8997A5 on #111820 ≈ 6:1. Green #16C784 and #6EA3FF text on panels pass 4.5:1; the raw blue #3B82F6 is used for fills and 2 px lines, and #2563EB sits behind white button text (5.2:1). Red text uses the lighter #F0525B (≈ 5:1); #EA3943 is for fills.<\u002Fdiv>\n<div style=\"flex:1 1 300px\"><b style=\"color:#E8EDF2\">Correlation / diverging scales.<\u002Fb> Blue ↔ amber rather than green ↔ red, so the heatmap does not read as profit/loss and stays distinguishable for red-green colour blindness.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Type -->\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<section class=\"pn\" style=\"flex:1 1 520px\">\n<h2>04 · Typography<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px\">\n<div><div class=\"lab\">Inter · interface<\u002Fdiv><div style=\"font-size:22px;font-weight:600;letter-spacing:-.01em\">Risk Analytics — Volatility regime<\u002Fdiv><div style=\"font-size:13px;color:#8997A5\">Body 13 px / 12.5 px dense · labels 10.5 px caps +8 % tracking<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\">IBM Plex Mono · numbers, tickers, indicators (tabular figures)<\u002Fdiv>\n<div class=\"mono\" style=\"font-size:26px;font-weight:500\">1,284.50 &nbsp;<span style=\"color:#16C784\">▲ +1.82%<\u002Fspan><\u002Fdiv>\n<div class=\"mono\" style=\"font-size:13px;color:#C4CFDA;line-height:1.7\">  SPY     512.40   +0.42%<br>  TLT      92.30   −0.28%<br>  BTC-USD 68,420.00 −1.34%<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\">JetBrains Mono · code, parameters, equations<\u002Fdiv><div class=\"code\" style=\"margin-top:4px\">dx/dt = σ(y − x)   σ=10.0  ρ=28.0  β=8/3\nmethod=\"RK45\"  rtol=1e-9  atol=1e-12  seed=42<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"pn\" style=\"flex:1 1 420px\">\n<h2>05 · Tokens (Tailwind)<\u002Fh2>\n<div class=\"code\" style=\"margin-top:16px\">theme.extend.colors = {\n  bg:      { 0:'#0B0F14', 1:'#111820', 2:'#17212B' },\n  border:  '#263442',\n  text:    { 1:'#E8EDF2', 2:'#8997A5' },\n  pos:     '#16C784',   // gain\n  neg:     '#EA3943',   // loss\n  analytic:'#3B82F6',   // action, analysis\n  science: '#8B5CF6',   // dynamical systems\n  warn:    '#F5A623',   // alert, demo\n}\nradius: { sm:3, md:5, lg:6 }\nspacing grid: 4 px · row height 34 px\nfonts: Inter · IBM Plex Mono · JetBrains Mono<\u002Fdiv>\n<div style=\"color:#8997A5;font-size:11.5px;margin-top:10px;line-height:1.5\">Layers: <span class=\"mono\">src/theme/tokens.ts<\u002Fspan> exports the object; <span class=\"mono\">tailwind.config.ts<\u002Fspan> imports it so charts (Plotly) read the same values.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<!-- Components -->\n<section class=\"pn\">\n<h2>06 · Components &amp; states<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;margin-top:16px\">\n\n<div style=\"flex:1 1 420px;display:flex;flex-direction:column;gap:12px\">\n<div class=\"lab\">BUTTONS · default · hover · focus · active · disabled · loading<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<span class=\"btn pri\">Default<\u002Fspan>\n<span class=\"btn pri\" style=\"background:#1D4FD8;border-color:#1D4FD8\">Hover<\u002Fspan>\n<span class=\"btn pri\" style=\"outline:2px solid #6EA3FF;outline-offset:2px\">Focus<\u002Fspan>\n<span class=\"btn pri\" style=\"background:#1E40AF;border-color:#1E40AF;transform:translateY(1px)\">Active<\u002Fspan>\n<span class=\"btn pri\" style=\"opacity:.4\">Disabled<\u002Fspan>\n<span class=\"btn pri\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 9 9\"><\u002Fpath><\u002Fsvg>Running<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<span class=\"btn\">Secondary<\u002Fspan><span class=\"btn\" style=\"border-color:#3a4d60;background:#1c2834\">Hover<\u002Fspan><span class=\"btn\" style=\"outline:2px solid #6EA3FF;outline-offset:2px\">Focus<\u002Fspan><span class=\"btn\" style=\"opacity:.4\">Disabled<\u002Fspan>\n<\u002Fdiv>\n\n<div class=\"lab\" style=\"margin-top:8px\">INPUTS · default · focus · error · success · disabled<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Ticker<\u002Fdiv><div class=\"inp\">SPY<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Confidence level<\u002Fdiv><div class=\"inp\" style=\"border-color:#3B82F6;box-shadow:0 0 0 2px rgba(59,130,246,.3)\">0.95<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Window (days)<\u002Fdiv><div class=\"inp\" style=\"border-color:#EA3943\">−5<\u002Fdiv><div style=\"font-size:10.5px;color:#F0525B;margin-top:3px\">Must be a positive integer.<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Seed<\u002Fdiv><div class=\"inp\" style=\"border-color:#16C784\">42<\u002Fdiv><div style=\"font-size:10.5px;color:#16C784;margin-top:3px\">✓ Reproducible<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Engine<\u002Fdiv><div class=\"inp\" style=\"opacity:.45\">local<\u002Fdiv><\u002Fdiv>\n<div><div class=\"lab\" style=\"margin-bottom:4px\">Date range<\u002Fdiv><div class=\"inp\" style=\"justify-content:space-between\">2025-11-19 → 2026-11-19<svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#8997A5\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M3 5h18v16H3z M3 10h18 M8 3v4 M16 3v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:12px\">\n<div class=\"lab\">BADGES · STATUS<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span class=\"bd ok\">SUCCESS<\u002Fspan><span class=\"bd run\">RUNNING<\u002Fspan><span class=\"bd err\">FAILED<\u002Fspan><span class=\"bd q\">QUEUED<\u002Fspan><span class=\"bd wn\">DEMO DATA<\u002Fspan><span class=\"bd\" style=\"color:#A78BFA;border-color:#3b2d6b;background:#1b1633\">DYNAMICAL<\u002Fspan><\u002Fdiv>\n<div class=\"lab\" style=\"margin-top:6px\">TABS<\u002Fdiv>\n<div style=\"display:flex;gap:2px;border-bottom:1px solid #263442\"><span style=\"padding:8px 12px;border-bottom:2px solid #3B82F6;font-weight:500\">Price<\u002Fspan><span style=\"padding:8px 12px;color:#8997A5\">Returns<\u002Fspan><span style=\"padding:8px 12px;color:#8997A5\">Risk<\u002Fspan><span style=\"padding:8px 12px;color:#4d5b69\">Fundamentals<\u002Fspan><\u002Fdiv>\n<div class=\"lab\" style=\"margin-top:6px\">TOOLTIP (chart crosshair)<\u002Fdiv>\n<div style=\"display:inline-flex;flex-direction:column;gap:3px;background:#17212B;border:1px solid #3a4d60;border-radius:5px;padding:8px 10px;align-self:flex-start;box-shadow:0 6px 18px rgba(0,0,0,.45)\"><span class=\"mono\" style=\"font-size:10.5px;color:#8997A5\">2026-11-12 · close<\u002Fspan><span class=\"mono\" style=\"font-size:13px\">512.40 <span style=\"color:#16C784\">▲ +0.42%<\u002Fspan><\u002Fspan><span class=\"mono\" style=\"font-size:10.5px;color:#8997A5\">Vol 61.2M · σ20 14.8%<\u002Fspan><\u002Fdiv>\n<div class=\"lab\" style=\"margin-top:6px\">TOASTS<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<div style=\"display:flex;gap:8px;align-items:center;background:#0e2a22;border:1px solid #14533d;border-radius:5px;padding:8px 10px;font-size:12px\"><span style=\"color:#16C784\">✓<\u002Fspan> Backtest finished · run_0a41f2<\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:center;background:#2b1215;border:1px solid #6b2327;border-radius:5px;padding:8px 10px;font-size:12px\"><span style=\"color:#F0525B\">✕<\u002Fspan> Ingest failed: provider timeout. <span style=\"text-decoration:underline\">Retry<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1 1 340px;display:flex;flex-direction:column;gap:12px\">\n<div class=\"lab\">SKELETON LOADER<\u002Fdiv>\n<div style=\"background:#0B0F14;border:1px solid #1d2935;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px\"><div class=\"sk\" style=\"height:10px;width:40%\"><\u002Fdiv><div class=\"sk\" style=\"height:60px\"><\u002Fdiv><div class=\"sk\" style=\"height:10px;width:70%\"><\u002Fdiv><\u002Fdiv>\n<div class=\"lab\" style=\"margin-top:6px\">EMPTY STATE<\u002Fdiv>\n<div style=\"background:#0B0F14;border:1px dashed #263442;border-radius:6px;padding:18px;text-align:center\"><div style=\"font-weight:500\">No experiments yet<\u002Fdiv><div style=\"color:#8997A5;font-size:12px;margin:4px 0 10px\">Experiments record parameters, seed and results so you can reproduce a run.<\u002Fdiv><span class=\"btn pri\">New Experiment<\u002Fspan><\u002Fdiv>\n<div class=\"lab\" style=\"margin-top:6px\">ERROR STATE<\u002Fdiv>\n<div style=\"background:#2b1215;border:1px solid #6b2327;border-radius:6px;padding:14px\"><div style=\"font-weight:500;color:#F0525B\">Simulation diverged at t = 14.2<\u002Fdiv><div class=\"mono\" style=\"color:#C4CFDA;font-size:11.5px;margin:4px 0 8px\">‖x‖ → ∞ · method RK45 · rtol 1e-9<\u002Fdiv><span class=\"btn\">Reduce step size<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"mono\" style=\"color:#8997A5;font-size:11px\">Icons: Lucide (lucide-react). Charts: Plotly with the tokens above. All sample values are synthetic.<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2100}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { swatches: [\n      { n: 'Background', hex: '#0B0F14', role: 'App canvas' },\n      { n: 'Background 2', hex: '#111820', role: 'Sidebar, panels' },\n      { n: 'Surface', hex: '#17212B', role: 'Inputs, cards on panels' },\n      { n: 'Border', hex: '#263442', role: '1 px dividers' },\n      { n: 'Text', hex: '#E8EDF2', role: 'Primary text' },\n      { n: 'Text secondary', hex: '#8997A5', role: 'Labels, axes' },\n      { n: 'Quant green', hex: '#16C784', role: 'Positive change only' },\n      { n: 'Quant red', hex: '#EA3943', role: 'Negative change only' },\n      { n: 'Analytic blue', hex: '#3B82F6', role: 'Actions, analysis' },\n      { n: 'Action blue (fill)', hex: '#2563EB', role: 'Primary button, white text' },\n      { n: 'Scientific purple', hex: '#8B5CF6', role: 'Dynamical systems' },\n      { n: 'Alert amber', hex: '#F5A623', role: 'Warnings, DEMO flag' }\n    ] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

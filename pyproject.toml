[project]
name = "quantlab"
version = "0.1.0.dev0"
description = "Scientific engine for quantitative finance and computational dynamics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Charts for notebooks and reports (see docs/adr/0003). The numerical core does not need them.
plot = ["plotly>=6.0"]
# Yahoo Finance prices (see docs/adr/0005). Lives in connectors/, outside the engine (RULE 002).
yahoo = ["yfinance>=1.8.0"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "plotly>=6.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "scipy-stubs>=1.18.1.1",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The engine lives in engine/quantlab (see docs/adr/0001). The import name stays `quantlab`.
# Connectors to external services live in connectors/, outside the engine (docs/adr/0005).
[tool.hatch.build.targets.wheel]
packages = ["engine/quantlab", "connectors/quantlab_connectors"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["engine", "connectors", "tests"]
# Vendored agent skills and design assets are not project code.
extend-exclude = [".agents", "Assets"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "NPY",     # NumPy-specific rules
    "PT",      # flake8-pytest-style
    "RUF",     # Ruff-specific rules
    "D",       # pydocstyle (RULE 011)
    "PLR2004", # magic numbers (RULE 009)
]

# Deliberate typography in chart labels: minus sign, rho, sigma, multiplication sign.
allowed-confusables = ["−", "ρ", "σ", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/quantlab", "connectors/quantlab_connectors", "tests"]
mypy_path = ["engine", "connectors"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Plotly and yfinance ship no type information (no py.typed marker).
module = ["plotly", "plotly.*", "yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `network` call real services and are off by default: run them with `-m network`.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not network",
]
markers = ["network: calls a real external service (deselected by default)"]
# Numerical warnings (overflow, invalid value, division by zero) must never pass silently.
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["quantlab", "quantlab_connectors"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

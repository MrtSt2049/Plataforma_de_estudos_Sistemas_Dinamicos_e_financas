name: Frontend

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**", "engine/quantlab/visualization/theme.py", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "engine/quantlab/visualization/theme.py", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Exact versions from the lockfile (supply-chain guidance of the plan, F0).
      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The tests compare tokens.ts with the engine's chart theme, hence the checkout of the whole repository.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      # F8: no secret may reach the bundle that is served to every visitor.
      - name: No secrets in the bundle
        run: npm run check:bundle
